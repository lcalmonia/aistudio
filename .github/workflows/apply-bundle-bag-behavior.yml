name: Apply combo customization bag behavior

on:
  push:
    branches:
      - feature/customer-bundle-modifier-selection

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'lcalmonia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/customer-bundle-modifier-selection
          fetch-depth: 1
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]}')
              p.write_text(text.replace(old, new, 1))

          replace('src/types.ts',
              "  bundleData?: PromoBundle;\n}",
              "  bundleData?: PromoBundle;\n  bundleSelections?: CustomerCartItem[];\n}")

          replace('src/components/customer/CustomerOrderPortal.tsx',
              "import { CustomerProductModal } from './CustomerProductModal';",
              "import { CustomerProductModal } from './CustomerProductModal';\nimport { BundleCustomizationModal } from './BundleCustomizationModal';")

          replace('src/components/customer/CustomerOrderPortal.tsx',
              "  const [isProductModalOpen, setIsProductModalOpen] = useState<boolean>(false);",
              "  const [isProductModalOpen, setIsProductModalOpen] = useState<boolean>(false);\n  const [selectedBundle, setSelectedBundle] = useState<PromoBundle | null>(null);\n  const [isBundleCustomizationOpen, setIsBundleCustomizationOpen] = useState<boolean>(false);")

          replace('src/components/customer/CustomerOrderPortal.tsx',
              "    setIsCartOpen(true);\n  };\n\n  const handleAddBundleToCart",
              "  };\n\n  const handleAddBundleToCart")

          start = "  const handleAddBundleToCart = (bundle: PromoBundle) => {"
          text = Path('src/components/customer/CustomerOrderPortal.tsx').read_text()
          a = text.index(start)
          b = text.index("\n\n  const handleUpdateCartQuantity", a)
          new_handler = '''  const handleAddBundleToCart = (bundle: PromoBundle) => {
    setSelectedBundle(bundle);
    setIsBundleCustomizationOpen(true);
  };

  const handleCompleteBundleCustomization = (selections: CustomerCartItem[]) => {
    if (!selectedBundle) return;

    const dummyMenuItem: MenuItem = {
      id: selectedBundle.id,
      name: selectedBundle.name,
      category: 'Combos & Promos',
      price: selectedBundle.price,
      image: selectedBundle.image,
      description: selectedBundle.description,
      available: true,
      temperature: 'N/A',
      tags: ['Combo Bundle', 'Special Offer'],
    };

    const cartBundle: CustomerCartItem = {
      id: `cart-bundle-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
      menuItem: dummyMenuItem,
      quantity: 1,
      unitPrice: selectedBundle.price,
      totalPrice: selectedBundle.price,
      selectedTemperature: 'N/A',
      isBundle: true,
      bundleData: selectedBundle,
      bundleSelections: selections,
    };

    setCartItems((prev) => [...prev, cartBundle]);
    setSelectedBundle(null);
    setIsBundleCustomizationOpen(false);
    // Do NOT open the Order Bag here. The customer opens it only via "View Order Bag".
  };'''
          text = text[:a] + new_handler + text[b:]
          Path('src/components/customer/CustomerOrderPortal.tsx').write_text(text)

          marker = "      {/* Customer Bag & Checkout Drawer */}\n      <CustomerCartDrawer"
          insertion = '''      <BundleCustomizationModal
        isOpen={isBundleCustomizationOpen}
        onClose={() => {
          setIsBundleCustomizationOpen(false);
          setSelectedBundle(null);
        }}
        bundle={selectedBundle}
        menuItems={availableItems}
        addonsList={addons}
        modifierCategories={modifierCategories}
        onComplete={handleCompleteBundleCustomization}
      />

      {/* Customer Bag & Checkout Drawer */}
      <CustomerCartDrawer'''
          replace('src/components/customer/CustomerOrderPortal.tsx', marker, insertion)

          # The bundle-aware wrapper is no longer needed; keep the original cart drawer as the single source.
          wrapper = Path('src/components/customer/CustomerCartDrawer.ts')
          if wrapper.exists():
              wrapper.unlink()

          workflow = Path('.github/workflows/apply-bundle-bag-behavior.yml')
          workflow.unlink()

          # Commit all changes using the checked-out branch.
          import subprocess
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Keep order bag closed during combo customization'], check=True)
          subprocess.run(['git', 'push'], check=True)
