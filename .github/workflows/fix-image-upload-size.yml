name: Fix image upload size retry

on:
  push:
    branches:
      - fix-responsive-admin-views

permissions:
  contents: write

jobs:
  fix-image-upload-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply image upload fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          http = Path('netlify/functions/_shared/http.mts')
          text = http.read_text()
          text, count = re.subn(r'const MAX_JSON_BYTES = 64 \* 1024;', 'const MAX_JSON_BYTES = 2 * 1024 * 1024;', text, count=1)
          if count != 1:
              raise SystemExit('Expected MAX_JSON_BYTES line not found')
          http.write_text(text)

          product = Path('src/components/EditProductModal.tsx')
          text = product.read_text()
          import_line = "import { prepareUploadedImage } from '../utils/imageCompression';"
          if import_line not in text:
              marker = "} from '../utils/productDraft';"
              if marker not in text:
                  raise SystemExit('Expected productDraft import not found')
              text = text.replace(marker, marker + '\n' + import_line, 1)

          product_handlers = '''  // Photo handlers - optimize uploaded images before storing them in the JSON draft.
  const handleFileUpload = async (e: React.ChangeEvent<HTMLInputElement>) => {
    const file = e.target.files?.[0];
    if (!file) return;

    try {
      const preparedImage = await prepareUploadedImage(file);
      setImage(preparedImage);
    } catch (error) {
      const message = error instanceof Error ? error.message : 'The image could not be prepared.';
      window.alert(message);
    } finally {
      e.target.value = '';
    }
  };

  const handleDrop = async (e: React.DragEvent<HTMLDivElement>) => {
    e.preventDefault();
    setIsDragOver(false);
    const file = e.dataTransfer.files?.[0];
    if (!file) return;

    try {
      const preparedImage = await prepareUploadedImage(file);
      setImage(preparedImage);
    } catch (error) {
      const message = error instanceof Error ? error.message : 'The image could not be prepared.';
      window.alert(message);
    }
  };

'''
          pattern = r'  // Photo handlers\n.*?(?=  // Size row handlers)'
          text, count = re.subn(pattern, product_handlers, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected product photo handler block not found')
          text = text.replace('Supports JPG, PNG, WEBP high-res images', 'JPG, PNG, WEBP — images are automatically optimized before saving', 1)
          product.write_text(text)

          settings = Path('src/components/SettingsView.tsx')
          text = settings.read_text()
          import_line = "import { prepareUploadedImage } from '../utils/imageCompression';"
          if import_line not in text:
              marker = "import { StoreSettings } from '../types';"
              if marker not in text:
                  raise SystemExit('Expected SettingsView import not found')
              text = text.replace(marker, marker + '\n' + import_line, 1)

          settings_handler = '''  const handleFileUpload = async (e: React.ChangeEvent<HTMLInputElement>) => {
    const file = e.target.files?.[0];
    if (!file) return;

    if (!file.type.startsWith('image/')) {
      onShowNotification('Please upload an image file (PNG, JPG, WEBP, SVG).');
      return;
    }

    if (file.size > 10 * 1024 * 1024) {
      onShowNotification('File is too large. Please select an image under 10MB.');
      return;
    }

    try {
      const preparedImage = await prepareUploadedImage(file);
      handleInputChange('logoUrl', preparedImage);
      onShowNotification('Store logo optimized and loaded! Click Save to apply live. ☕✨');
    } catch (error) {
      const message = error instanceof Error ? error.message : 'The logo could not be prepared.';
      onShowNotification(message);
    }
  };

'''
          pattern = r'  const handleFileUpload = .*?(?=  const handleRemoveLogo)'
          text, count = re.subn(pattern, settings_handler, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected SettingsView upload handler not found')
          settings.write_text(text)

          Path('.github/workflows/fix-image-upload-size.yml').unlink()
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix image upload request size handling"
          git push
