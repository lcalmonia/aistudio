name: Image upload fix

on:
  push:
    branches: [fix-responsive-admin-views]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        env:
          PRODUCT_HANDLER_B64: 
          SETTINGS_HANDLER_B64: 
        run: |
          python -c "from pathlib import Path; p=Path('netlify/functions/_shared/http.mts'); s=p.read_text(); p.write_text(s.replace('const MAX_JSON_BYTES = 64 * 1024;','const MAX_JSON_BYTES = 2 * 1024 * 1024;',1))"
          python -c "from pathlib import Path; import re,base64; p=Path('src/components/EditProductModal.tsx'); s=p.read_text(); s=s.replace(\"} from '../utils/productDraft';\",\"} from '../utils/productDraft';\\nimport { prepareUploadedImage } from '../utils/imageCompression';\",1); r=base64.b64decode('${PRODUCT_HANDLER_B64}').decode(); s,n=re.subn(r'  // Photo handlers\\n.*?(?=  // Size row handlers)',r,s,flags=re.S,count=1); assert n==1; s=s.replace('Supports JPG, PNG, WEBP high-res images','JPG, PNG, WEBP — images are automatically optimized before saving',1); p.write_text(s)"
          python -c "from pathlib import Path; import re,base64; p=Path('src/components/SettingsView.tsx'); s=p.read_text(); s=s.replace(\"import { StoreSettings } from '../types';\",\"import { StoreSettings } from '../types';\\nimport { prepareUploadedImage } from '../utils/imageCompression';\",1); r=base64.b64decode('${SETTINGS_HANDLER_B64}').decode(); s,n=re.subn(r'  const handleFileUpload = .*?(?=  const handleRemoveLogo)',r,s,flags=re.S,count=1); assert n==1; p.write_text(s)"
          rm -f .github/workflows/fix-image-upload-size.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix image upload request size handling"
          git push
