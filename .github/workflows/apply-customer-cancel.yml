name: Apply Customer Order Cancellation Patch

on:
  push:
    branches:
      - customer-delete-pending-orders

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'chore: apply customer order cancellation patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Apply remaining patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}')
              if text.count(old) != 1:
                  raise SystemExit(f'Pattern occurs {text.count(old)} times in {path}, expected exactly 1')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/services/orderService.ts',
              """  /**
   * Delete or archive order
   */
""",
              """  /**
   * Cancel a customer order while it is still New.
   * The server verifies ownership and prevents cancellation after preparation starts.
   */
  async cancelCustomerOrder(orderId: string, customerId: string, customerEmail?: string): Promise<Order | null> {
    try {
      const response = await api<{ order: Order }>(`/api/orders/${encodeURIComponent(orderId)}`, {
        method: 'PATCH',
        body: JSON.stringify({
          action: 'customer-cancel',
          customerId,
          customerEmail,
        }),
      });

      if (response && response.order) {
        const updated = response.order;
        const local = storageAdapter.getOrders();
        const updatedList = local.map((o) =>
          o.id === updated.id || o.orderNumber === updated.orderNumber ? updated : o
        );
        storageAdapter.setOrders(updatedList);
        return updated;
      }
    } catch (err) {
      console.warn(`[OrderService] Customer cancellation failed for ${orderId}:`, err);
      throw err;
    }

    return null;
  },

  /**
   * Delete or archive order
   */
"""
          )

          portal = 'src/components/customer/CustomerOrderPortal.tsx'
          replace_once(
              portal,
              "import { CustomerOrderSuccessModal } from './CustomerOrderSuccessModal';\n",
              "import { CustomerOrderSuccessModal } from './CustomerOrderSuccessModal';\nimport { orderService } from '../../services/orderService';\n"
          )
          replace_once(
              portal,
              """  const [isSuccessModalOpen, setIsSuccessModalOpen] = useState<boolean>(false);
  const [activeTrackingOrder, setActiveTrackingOrder] = useState<Order | null>(lastCustomerOrder);
""",
              """  const [isSuccessModalOpen, setIsSuccessModalOpen] = useState<boolean>(false);
  const [activeTrackingOrder, setActiveTrackingOrder] = useState<Order | null>(lastCustomerOrder);
  const [cancelledOrders, setCancelledOrders] = useState<Record<string, Order>>({});
  const [cancellingOrderId, setCancellingOrderId] = useState<string | null>(null);
"""
          )
          replace_once(
              portal,
              """    return orders.filter(
      (o) =>
        o &&
        (o.customerId === currentCustomer.id ||
          (customerEmail && o.customerEmail && o.customerEmail.toLowerCase() === customerEmail) ||
          (customerName && o.customerName && o.customerName.toLowerCase() === customerName))
    );
  }, [orders, currentCustomer]);
""",
              """    return orders
      .map((o) => cancelledOrders[o.id] || o)
      .filter(
        (o) =>
          o &&
          (o.customerId === currentCustomer.id ||
            (customerEmail && o.customerEmail && o.customerEmail.toLowerCase() === customerEmail) ||
            (customerName && o.customerName && o.customerName.toLowerCase() === customerName))
      );
  }, [orders, currentCustomer, cancelledOrders]);
"""
          )
          replace_once(
              portal,
              """  const handleFinalizeOrder = (newOrder: Order) => {
    onPlaceCustomerOrder(newOrder);
    setActiveTrackingOrder(newOrder);
    setIsSuccessModalOpen(true);
  };

  const handleSaveProfile""",
              """  const handleFinalizeOrder = (newOrder: Order) => {
    onPlaceCustomerOrder(newOrder);
    setActiveTrackingOrder(newOrder);
    setIsSuccessModalOpen(true);
  };

  const handleCancelOrder = async (order: Order) => {
    if (order.status !== 'New') return;

    const confirmed = window.confirm(
      `Cancel order #${order.orderNumber}?\\n\\nThis can only be cancelled while the order is still New.`
    );
    if (!confirmed) return;

    setCancellingOrderId(order.id);
    try {
      const cancelled = await orderService.cancelCustomerOrder(
        order.id,
        currentCustomer.id,
        currentCustomer.email
      );

      if (cancelled) {
        setCancelledOrders((prev) => ({ ...prev, [cancelled.id]: cancelled }));
        setActiveTrackingOrder(cancelled);
      }
    } catch (error) {
      const message = error instanceof Error ? error.message : 'Unable to cancel the order.';
      window.alert(message);
    } finally {
      setCancellingOrderId(null);
    }
  };

  const handleSaveProfile"""
          )
          replace_once(
              portal,
              """                      {/* Footer Actions */}
                      <div className=\"flex justify-between items-center pt-1\">""",
              """                      {/* Footer Actions */}
                      <div className=\"flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 pt-1\">"""
          )
          replace_once(
              portal,
              """                        <button
                          onClick={() => {
                            setActiveTrackingOrder(ord);
                            setIsSuccessModalOpen(true);
                          }}
                          className=\"px-3.5 py-1.5 bg-[#26170c] text-white text-xs font-bold rounded-xl shadow-xs hover:bg-[#3d2b1f] transition-all cursor-pointer flex items-center gap-1\"
                        >
                          <span className=\"material-symbols-outlined text-[15px]\">visibility</span>
                          <span>Track Order</span>
                        </button>
""",
              """                        <div className=\"flex items-center gap-2 self-end sm:self-auto\">
                          {ord.status === 'New' && (
                            <button
                              type=\"button\"
                              onClick={() => handleCancelOrder(ord)}
                              disabled={cancellingOrderId === ord.id}
                              className=\"px-3.5 py-1.5 bg-[#ffdad6] text-[#93000a] text-xs font-bold rounded-xl border border-[#ffb4ab] hover:bg-[#ffb4ab] disabled:opacity-60 disabled:cursor-not-allowed transition-all cursor-pointer flex items-center gap-1\"
                            >
                              <span className=\"material-symbols-outlined text-[15px]\">{cancellingOrderId === ord.id ? 'hourglass_top' : 'cancel'}</span>
                              <span>{cancellingOrderId === ord.id ? 'Cancelling...' : 'Cancel Order'}</span>
                            </button>
                          )}
                          <button
                            onClick={() => {
                              setActiveTrackingOrder(ord);
                              setIsSuccessModalOpen(true);
                            }}
                            className=\"px-3.5 py-1.5 bg-[#26170c] text-white text-xs font-bold rounded-xl shadow-xs hover:bg-[#3d2b1f] transition-all cursor-pointer flex items-center gap-1\"
                          >
                            <span className=\"material-symbols-outlined text-[15px]\">visibility</span>
                            <span>Track Order</span>
                          </button>
                        </div>
"""
          )

          workflow = Path('.github/workflows/apply-customer-cancel.yml')
          workflow.unlink(missing_ok=True)

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/orderService.ts src/components/customer/CustomerOrderPortal.tsx .github/workflows/apply-customer-cancel.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: apply customer order cancellation patch"
          git push
