name: Apply Customer Order Cancellation Patch

on:
  push:
    branches:
      - customer-delete-pending-orders

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'chore: apply customer order cancellation patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch customer portal
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/components/customer/CustomerOrderPortal.tsx')
          text = p.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'Pattern not found: {old[:80]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'Pattern occurs {text.count(old)} times; expected 1')
              text = text.replace(old, new)

          if "from '../../services/orderService'" not in text:
              replace_once(
                  "import { CustomerOrderSuccessModal } from './CustomerOrderSuccessModal';\n",
                  "import { CustomerOrderSuccessModal } from './CustomerOrderSuccessModal';\nimport { orderService } from '../../services/orderService';\n"
              )

          if 'const [cancelledOrders, setCancelledOrders]' not in text:
              replace_once(
                  "  const [activeTrackingOrder, setActiveTrackingOrder] = useState<Order | null>(lastCustomerOrder);\n",
                  "  const [activeTrackingOrder, setActiveTrackingOrder] = useState<Order | null>(lastCustomerOrder);\n  const [cancelledOrders, setCancelledOrders] = useState<Record<string, Order>>({});\n  const [cancellingOrderId, setCancellingOrderId] = useState<string | null>(null);\n"
              )

          if 'cancelledOrders[o.id] || o' not in text:
              replace_once(
                  "    return orders.filter(\n      (o) =>\n        o &&\n        (o.customerId === currentCustomer.id ||\n          (customerEmail && o.customerEmail && o.customerEmail.toLowerCase() === customerEmail) ||\n          (customerName && o.customerName && o.customerName.toLowerCase() === customerName))\n    );\n  }, [orders, currentCustomer]);\n",
                  "    return orders\n      .map((o) => cancelledOrders[o.id] || o)\n      .filter(\n        (o) =>\n          o &&\n          (o.customerId === currentCustomer.id ||\n            (customerEmail && o.customerEmail && o.customerEmail.toLowerCase() === customerEmail) ||\n            (customerName && o.customerName && o.customerName.toLowerCase() === customerName))\n      );\n  }, [orders, currentCustomer, cancelledOrders]);\n"
              )

          if 'const handleCancelOrder = async' not in text:
              replace_once(
                  "  const handleSaveProfile = (e: React.FormEvent) => {\n",
                  """  const handleCancelOrder = async (order: Order) => {
    if (order.status !== 'New') return;
    const confirmed = window.confirm(
      `Cancel order #${order.orderNumber}?\\n\\nThis can only be cancelled while the order is still New.`
    );
    if (!confirmed) return;

    setCancellingOrderId(order.id);
    try {
      const cancelled = await orderService.cancelCustomerOrder(
        order.id,
        currentCustomer.id,
        currentCustomer.email
      );
      if (cancelled) {
        setCancelledOrders((prev) => ({ ...prev, [cancelled.id]: cancelled }));
        setActiveTrackingOrder(cancelled);
      }
    } catch (error) {
      const message = error instanceof Error ? error.message : 'Unable to cancel the order.';
      window.alert(message);
    } finally {
      setCancellingOrderId(null);
    }
  };

  const handleSaveProfile = (e: React.FormEvent) => {
"""
              )

          if "{ord.status === 'New' && (" not in text:
              replace_once(
                  """                      {/* Footer Actions */}
                      <div className="flex justify-between items-center pt-1">
""",
                  """                      {/* Footer Actions */}
                      <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 pt-1">
"""
              )
              replace_once(
                  """                        <button
                          onClick={() => {
                            setActiveTrackingOrder(ord);
                            setIsSuccessModalOpen(true);
                          }}
                          className="px-3.5 py-1.5 bg-[#26170c] text-white text-xs font-bold rounded-xl shadow-xs hover:bg-[#3d2b1f] transition-all cursor-pointer flex items-center gap-1"
                        >
                          <span className="material-symbols-outlined text-[15px]">visibility</span>
                          <span>Track Order</span>
                        </button>
""",
                  """                        <div className="flex items-center gap-2 self-end sm:self-auto">
                          {ord.status === 'New' && (
                            <button
                              type="button"
                              onClick={() => handleCancelOrder(ord)}
                              disabled={cancellingOrderId === ord.id}
                              className="px-3.5 py-1.5 bg-[#ffdad6] text-[#93000a] text-xs font-bold rounded-xl border border-[#ffb4ab] hover:bg-[#ffb4ab] disabled:opacity-60 disabled:cursor-not-allowed transition-all cursor-pointer flex items-center gap-1"
                            >
                              <span className="material-symbols-outlined text-[15px]">{cancellingOrderId === ord.id ? 'hourglass_top' : 'cancel'}</span>
                              <span>{cancellingOrderId === ord.id ? 'Cancelling...' : 'Cancel Order'}</span>
                            </button>
                          )}
                          <button
                            onClick={() => {
                              setActiveTrackingOrder(ord);
                              setIsSuccessModalOpen(true);
                            }}
                            className="px-3.5 py-1.5 bg-[#26170c] text-white text-xs font-bold rounded-xl shadow-xs hover:bg-[#3d2b1f] transition-all cursor-pointer flex items-center gap-1"
                          >
                            <span className="material-symbols-outlined text-[15px]">visibility</span>
                            <span>Track Order</span>
                          </button>
                        </div>
"""
              )

          p.write_text(text, encoding='utf-8')

      - name: Remove patch workflow and commit
        run: |
          rm -f .github/workflows/apply-customer-cancel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/customer/CustomerOrderPortal.tsx .github/workflows/apply-customer-cancel.yml
          git commit -m "chore: apply customer order cancellation patch"
          git push
