name: Patch barista payment method
on:
  push:
    branches:
      - feature/collapsible-barista-order-sections
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'lcalmonia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ActiveOrdersView
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/ActiveOrdersView.tsx')
          s = p.read_text()
          s = s.replace("  const [activeMenuOrderId, setActiveMenuOrderId] = useState<string | null>(null);", "  const [activeMenuOrderId, setActiveMenuOrderId] = useState<string | null>(null);\n  const [paymentOrder, setPaymentOrder] = useState<Order | null>(null);")
          old = """    } else if (order.status === 'Ready') {\n      onUpdateOrderStatus(order.id, 'Completed');\n      confetti({\n        particleCount: 40,\n        spread: 60,\n        origin: { y: 0.8 },\n        colors: ['#26170c', '#8fbc8f', '#e1e1c9', '#fbddca']\n      });\n      onShowNotification(`Order #${order.orderNumber} completed! Have a great day.`);\n    }"""
          new = """    } else if (order.status === 'Ready') {\n      setPaymentOrder(order);\n    }"""
          if old not in s:
              raise SystemExit('status handler target not found')
          s = s.replace(old, new, 1)
          old_button = """                        <button\n                          onClick={() => handleStatusAdvance(order)}\n                          className=\"flex-1 bg-[#26170c] hover:bg-[#3d2b1f] text-white font-semibold text-sm py-2.5 rounded-full transition-all active:scale-95 shadow-sm flex items-center justify-center gap-1.5\"\n                        >\n                          <span className=\"material-symbols-outlined text-[18px]\">done_all</span>\n                          Complete Order\n                        </button>"""
          new_button = """                        <button\n                          onClick={() => handleStatusAdvance(order)}\n                          className=\"flex-1 bg-[#26170c] hover:bg-[#3d2b1f] text-white font-semibold text-sm py-2.5 rounded-full transition-all active:scale-95 shadow-sm flex items-center justify-center gap-1.5\"\n                        >\n                          <span className=\"material-symbols-outlined text-[18px]\">done_all</span>\n                          Complete Order\n                        </button>"""
          if old_button not in s:
              raise SystemExit('complete button target not found')
          # Button markup stays unchanged; behavior is redirected through handleStatusAdvance.
          marker = """      </div>\n    </div>\n  );\n};"""
          modal = """      </div>\n\n      {paymentOrder && (\n        <div className=\"fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"payment-method-title\">\n          <div className=\"w-full max-w-md bg-[#fff8f5] rounded-2xl shadow-2xl border border-[#e8e1df] overflow-hidden\">\n            <div className=\"px-5 py-4 border-b border-[#f3ecea] bg-[#f9f2f0] flex items-center justify-between\">\n              <div>\n                <p className=\"text-[10px] font-bold uppercase tracking-wider text-[#636451]\">Payment Method</p>\n                <h3 id=\"payment-method-title\" className=\"font-serif text-xl font-bold text-[#26170c] mt-0.5\">How did the customer pay?</h3>\n                <p className=\"text-xs text-[#81756e] mt-1\">Order #{paymentOrder.orderNumber} • ₱{paymentOrder.total.toFixed(2)}</p>\n              </div>\n              <button type=\"button\" onClick={() => setPaymentOrder(null)} className=\"p-2 rounded-full text-[#4f453f] hover:bg-[#e8e1df]\" aria-label=\"Close payment method dialog\">\n                <span className=\"material-symbols-outlined\">close</span>\n              </button>\n            </div>\n            <div className=\"p-5\">\n              <div className=\"grid grid-cols-2 gap-3\">\n                {(['GCash', 'Maya', 'Cash', 'Card'] as const).map((method) => (\n                  <button\n                    key={method}\n                    type=\"button\"\n                    onClick={() => {\n                      const order = paymentOrder;\n                      setPaymentOrder(null);\n                      onUpdateOrderStatus(order.id, 'Completed', method);\n                      confetti({ particleCount: 40, spread: 60, origin: { y: 0.8 }, colors: ['#26170c', '#8fbc8f', '#e1e1c9', '#fbddca'] });\n                      onShowNotification(`Order #${order.orderNumber} completed via ${method}. Have a great day.`);\n                    }}\n                    className=\"min-h-[64px] rounded-xl border border-[#dec1af] bg-white hover:bg-[#f3ecea] active:scale-95 transition-all text-sm font-bold text-[#26170c]\"\n                  >\n                    {method}\n                  </button>\n                ))}\n              </div>\n            </div>\n          </div>\n        </div>\n      )}\n    </div>\n  );\n};"""
          if marker not in s:
              raise SystemExit('component ending target not found')
          s = s.replace(marker, modal, 1)
          # Update the callback type so payment method can be persisted with completion.
          s = s.replace("onUpdateOrderStatus: (orderId: string, newStatus: OrderStatus) => void;", "onUpdateOrderStatus: (orderId: string, newStatus: OrderStatus, paymentMethod?: 'GCash' | 'Maya' | 'Cash' | 'Card') => void;")
          p.write_text(s)
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ActiveOrdersView.tsx .github/workflows/patch-payment-method.yml
          git commit -m "feat: ask payment method before completing barista orders"
          git rm .github/workflows/patch-payment-method.yml
          git commit -m "chore: remove temporary payment patch workflow"
          git push
