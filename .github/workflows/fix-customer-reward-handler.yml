name: Fix customer reward handler
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/customer/CustomerOrderPortal.tsx')
          s = p.read_text()
          import_line = "import { rewardClaimService } from '../../services/rewardClaimService';"
          lines = s.splitlines()
          out = []
          seen = False
          for line in lines:
              if line == import_line:
                  if seen:
                      continue
                  seen = True
              out.append(line)
          s = '\n'.join(out) + ('\n' if s.endswith('\n') else '')
          old = "  const handleRedeemPerk = async (perk: LoyaltyPerk) => { const { loyaltyService } = await import('../../services/loyaltyService'); const result = perk.redemptionType === 'points' ? await loyaltyService.redeemPoints(currentCustomer.id, perk.redemptionCost, `Redeemed perk: ${perk.name}`) : await loyaltyService.redeemStamps(currentCustomer.id, perk.redemptionCost, `Redeemed perk: ${perk.name}`); if (!result.success) { window.alert(result.error || 'Unable to redeem this perk.'); return; } window.location.reload(); };"
          new = """  const handleRedeemPerk = async (perk: LoyaltyPerk) => {
            try {
              await rewardClaimService.requestClaim(currentCustomer.id, perk.id);
              window.alert(`Reward claim sent! Please see the counter/barista to claim: ${perk.name}.`);
            } catch (error) {
              window.alert(error instanceof Error ? error.message : 'Unable to request this reward.');
            }
          };"""
          if old not in s:
              raise SystemExit('old reward handler not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/customer/CustomerOrderPortal.tsx
          git commit -m "Fix customer reward claim handler"
          git push
