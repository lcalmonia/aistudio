name: Add order and stats reset controls

on:
  push:
    branches:
      - fix-responsive-admin-views

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-responsive-admin-views
          fetch-depth: 0

      - name: Patch application code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]}')
              p.write_text(text.replace(old, new, 1))

          replace('src/components/ActiveOrdersView.tsx',
              "import { Order, OrderStatus } from '../types';",
              "import { AdminPrincipal, Order, OrderStatus } from '../types';")

          replace('src/components/ActiveOrdersView.tsx',
              "  isSyncing?: boolean;\n}",
              "  isSyncing?: boolean;\n  admin?: AdminPrincipal | null;\n}")

          replace('src/components/ActiveOrdersView.tsx',
              "  isSyncing = false,\n}) => {\n  const [selectedFilter, setSelectedFilter] = useState<'All' | 'New' | 'Brewing' | 'Ready' | 'Completed'>('All');",
              "  isSyncing = false,\n  admin,\n}) => {\n  const isSuperAdmin = admin?.role === 'SUPER_ADMIN';\n  const [selectedFilter, setSelectedFilter] = useState<'All' | 'Today' | 'New' | 'Brewing' | 'Ready' | 'Completed'>('All');")

          replace('src/components/ActiveOrdersView.tsx',
              "  const completedCount = orderList.filter((o) => o && o.status === 'Completed').length;\n  const allActiveCount = orderList.filter((o) => o && o.status !== 'Completed').length;",
              "  const completedCount = orderList.filter((o) => o && o.status === 'Completed').length;\n  const now = new Date();\n  const todayStart = new Date(now);\n  todayStart.setHours(0, 0, 0, 0);\n  const todayEnd = new Date(now);\n  todayEnd.setHours(23, 59, 59, 999);\n  const todayCount = orderList.filter((o) => o && o.timestamp >= todayStart.getTime() && o.timestamp <= todayEnd.getTime()).length;\n  const allActiveCount = orderList.filter((o) => o && o.status !== 'Completed').length;")

          replace('src/components/ActiveOrdersView.tsx',
              "    if (selectedFilter === 'All') return order.status !== 'Completed';\n    if (selectedFilter === 'New') return order.status === 'New';",
              "    if (selectedFilter === 'All') return order.status !== 'Completed';\n    if (selectedFilter === 'Today') return order.timestamp >= todayStart.getTime() && order.timestamp <= todayEnd.getTime();\n    if (selectedFilter === 'New') return order.status === 'New';")

          replace('src/components/ActiveOrdersView.tsx',
              "  const handleRemindCustomer = (order: Order) => {\n    onShowNotification(`Sent SMS reminder to ${order.customerName} (${order.customerPhone || 'customer'})! 📱`);\n  };",
              "  const handleRemindCustomer = (order: Order) => {\n    onShowNotification(`Sent SMS reminder to ${order.customerName} (${order.customerPhone || 'customer'})! 📱`);\n  };\n\n  const handleResetOrders = async () => {\n    if (!isSuperAdmin) return;\n    const confirmed = window.confirm(\n      'RESET ALL ORDERS? This permanently deletes every current and previous transaction from the Orders tab. This does not change menu, inventory, customers, or rewards.'\n    );\n    if (!confirmed) return;\n\n    try {\n      const { orderResetService } = await import('../services/orderResetService');\n      const deletedOrders = await orderResetService.resetAllOrders();\n      setSelectedFilter('All');\n      if (onRefreshOrders) await onRefreshOrders();\n      onShowNotification(`Orders reset successfully. ${deletedOrders} transaction(s) deleted.`);\n    } catch (error) {\n      console.error('[ActiveOrdersView] Failed to reset orders:', error);\n      onShowNotification('Unable to reset orders. No records were deleted.');\n    }\n  };")

          replace('src/components/ActiveOrdersView.tsx',
              "            <span className=\"inline-flex items-center gap-1.5 text-[11px] sm:text-xs font-semibold px-2.5 py-1 bg-[#e1e1c9] text-[#636451] rounded-full whitespace-nowrap\">",
              "            {isSuperAdmin && (\n              <button\n                type=\"button\"\n                onClick={handleResetOrders}\n                className=\"inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] sm:text-xs font-bold bg-[#ffdad6] text-[#93000a] border border-[#f2b8b5] hover:bg-[#ffc9c4] active:scale-95 transition-all whitespace-nowrap\"\n                title=\"Reset all orders\"\n              >\n                <span className=\"material-symbols-outlined text-[15px]\">delete_sweep</span>\n                Reset Orders\n              </button>\n            )}\n            <span className=\"inline-flex items-center gap-1.5 text-[11px] sm:text-xs font-semibold px-2.5 py-1 bg-[#e1e1c9] text-[#636451] rounded-full whitespace-nowrap\">")

          replace('src/components/ActiveOrdersView.tsx',
              "          <button\n            onClick={() => setSelectedFilter('All')}\n            className={`px-3.5 sm:px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all active:scale-95 flex-shrink-0 ${",
              "          <button\n            onClick={() => setSelectedFilter('All')}\n            className={`px-3.5 sm:px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all active:scale-95 flex-shrink-0 ${")

          marker = "          <button\n            onClick={() => setSelectedFilter('New')}"
          p = Path('src/components/ActiveOrdersView.tsx')
          text = p.read_text()
          if marker not in text:
              raise SystemExit('New filter marker not found')
          today_button = "          <button\n            onClick={() => setSelectedFilter('Today')}\n            className={`px-3.5 sm:px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all active:scale-95 flex-shrink-0 ${\n              selectedFilter === 'Today'\n                ? 'bg-[#3d2b1f] text-[#ac9181] shadow-sm font-bold'\n                : 'bg-[#f3ecea] text-[#4f453f] border border-[#d2c4bc] hover:bg-[#e8e1df]'\n            }`}\n          >\n            Today ({todayCount})\n          </button>\n"
          p.write_text(text.replace(marker, today_button + marker, 1))

          replace('src/components/StatsView.tsx',
              "import { orderService } from '../services/orderService';",
              "import { orderService } from '../services/orderService';\nimport { statsResetService } from '../services/statsResetService';")

          replace('src/components/StatsView.tsx',
              "  const [rangeOrders, setRangeOrders] = useState<Order[]>([]);\n  const [isLoadingRange, setIsLoadingRange] = useState<boolean>(false);",
              "  const [rangeOrders, setRangeOrders] = useState<Order[]>([]);\n  const [isLoadingRange, setIsLoadingRange] = useState<boolean>(false);\n  const [statsResetAt, setStatsResetAt] = useState<string | null>(null);\n  const [isResettingStats, setIsResettingStats] = useState<boolean>(false);")

          marker = "  // Ensure Admin role cannot remain on an unauthorized preset"
          p = Path('src/components/StatsView.tsx')
          text = p.read_text()
          if marker not in text:
              raise SystemExit('Stats preset marker not found')
          load_reset = "  useEffect(() => {\n    let active = true;\n    statsResetService.getResetAt()\n      .then((resetAt) => {\n        if (active) setStatsResetAt(resetAt);\n      })\n      .catch((err) => console.error('[StatsView] Failed to load stats reset state:', err));\n    return () => { active = false; };\n  }, []);\n\n"
          p.write_text(text.replace(marker, load_reset + marker, 1))

          replace('src/components/StatsView.tsx',
              "  const fetchRangeOrders = useCallback(async () => {\n    try {\n      setIsLoadingRange(true);\n      if (boundary.isAllTime) {\n        // Query up to 10000 historical orders for All Time without 200 order limit\n        const allOrders = await orderService.listOrders({ limit: 10000 });\n        setRangeOrders(allOrders);\n      } else {\n        const filtered = await orderService.listOrders({\n          startDate: boundary.startDate,\n          endDate: boundary.endDate,\n          limit: 10000,\n        });\n        setRangeOrders(filtered);\n      }",
              "  const fetchRangeOrders = useCallback(async () => {\n    try {\n      setIsLoadingRange(true);\n      const resetMs = statsResetAt ? new Date(statsResetAt).getTime() : 0;\n\n      if (boundary.isAllTime) {\n        const filtered = await orderService.listOrders({\n          startDate: resetMs > 0 ? new Date(resetMs).toISOString() : undefined,\n          limit: 10000,\n        });\n        setRangeOrders(filtered);\n      } else {\n        const boundaryStartMs = boundary.startDate ? new Date(boundary.startDate).getTime() : 0;\n        const boundaryEndMs = boundary.endDate ? new Date(boundary.endDate).getTime() : Number.POSITIVE_INFINITY;\n        const effectiveStartMs = Math.max(boundaryStartMs, resetMs);\n\n        if (effectiveStartMs > boundaryEndMs) {\n          setRangeOrders([]);\n        } else {\n          const filtered = await orderService.listOrders({\n            startDate: effectiveStartMs > 0 ? new Date(effectiveStartMs).toISOString() : boundary.startDate,\n            endDate: boundary.endDate,\n            limit: 10000,\n          });\n          setRangeOrders(filtered);\n        }\n      }")

          replace('src/components/StatsView.tsx',
              "  }, [boundary.isAllTime, boundary.startDate, boundary.endDate, propOrders]);",
              "  }, [boundary.isAllTime, boundary.startDate, boundary.endDate, propOrders, statsResetAt]);")

          marker = "  const handleSelectPreset = (presetKey: StatsDateRangePreset) => {"
          p = Path('src/components/StatsView.tsx')
          text = p.read_text()
          if marker not in text:
              raise SystemExit('Stats preset handler marker not found')
          reset_handler = "  const handleResetStats = async () => {\n    if (!isSuperAdmin || isResettingStats) return;\n    const confirmed = window.confirm(\n      'RESET SALES STATISTICS? This clears the Stats tab by starting a new reporting period now. Orders and other records are NOT deleted.'\n    );\n    if (!confirmed) return;\n\n    try {\n      setIsResettingStats(true);\n      const resetAt = await statsResetService.reset();\n      setStatsResetAt(resetAt);\n      setRangeOrders([]);\n    } catch (error) {\n      console.error('[StatsView] Failed to reset stats:', error);\n      window.alert('Unable to reset sales statistics. No records were changed.');\n    } finally {\n      setIsResettingStats(false);\n    }\n  };\n\n"
          p.write_text(text.replace(marker, reset_handler + marker, 1))

          replace('src/components/StatsView.tsx',
              "          <span>{isLoadingRange ? 'Refreshing...' : 'Refresh'}</span>\n        </button>",
              "          <span>{isLoadingRange ? 'Refreshing...' : 'Refresh'}</span>\n        </button>\n        {isSuperAdmin && (\n          <button\n            type=\"button\"\n            onClick={handleResetStats}\n            disabled={isResettingStats}\n            className=\"flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold bg-[#ffdad6] text-[#93000a] border border-[#f2b8b5] hover:bg-[#ffc9c4] active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap\"\n            title=\"Reset all sales statistics\"\n          >\n            <span className={`material-symbols-outlined text-[16px] ${isResettingStats ? 'animate-spin' : ''}`}>\n              delete_sweep\n            </span>\n            <span>{isResettingStats ? 'Resetting...' : 'Reset Stats'}</span>\n          </button>\n        )}")

          replace('src/App.tsx',
              "                onRefreshOrders={refreshOrders}\n                isSyncing={isSyncingOrders}",
              "                onRefreshOrders={refreshOrders}\n                isSyncing={isSyncingOrders}\n                admin={adminPrincipal}")
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ActiveOrdersView.tsx src/components/StatsView.tsx src/App.tsx
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Add Super Admin order and stats reset controls"
          git push origin HEAD:fix-responsive-admin-views

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/add-order-stats-reset.yml
          git add .github/workflows/add-order-stats-reset.yml
          git commit -m "Remove temporary reset patch workflow"
          git push origin HEAD:fix-responsive-admin-views
