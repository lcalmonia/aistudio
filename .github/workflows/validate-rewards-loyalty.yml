name: Validate rewards loyalty
on:
  push:
    branches: [rewards-loyalty-configurable]
    paths-ignore: ['.github/workflows/validate-rewards-loyalty.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-rewards-loyalty.yml
          git commit -m "chore: remove rewards validation workflow"
          git push
