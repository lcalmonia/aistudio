name: One-time menu permissions patch 2
on:
  push:
    branches:
      - fix/admin-menu-readonly
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-menu-readonly
          fetch-depth: 0
      - name: Patch product availability control
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/AdminMenuView.tsx')
          s = p.read_text()
          start = s.index('                  {/* Card Bottom Controls: In-Stock Toggle & Edit Actions */}')
          end = s.index('                    {/* Actions: [ View ] [ Edit ] [ Copy ] [ Delete ] */}', start)
          block = s[start:end]
          if '{isSuperAdmin && (' in block:
              raise SystemExit('Stock control already patched')
          marker = '                    {/* Stock Switch */}'
          a = block.index(marker)
          button_start = block.index('                    <button', a)
          button_end = block.index('                    </button>', button_start) + len('                    </button>')
          button = block[button_start:button_end]
          wrapped = '                    {isSuperAdmin && (\n' + button + '\n                    )}'
          block = block[:button_start] + wrapped + block[button_end:]
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
      - name: Commit and remove patch workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminMenuView.tsx
          git rm .github/workflows/one-time-readonly-menu.yml .github/workflows/one-time-readonly-menu2.yml
          git commit -m "Restrict menu availability control to Super Admin"
          git push origin fix/admin-menu-readonly
