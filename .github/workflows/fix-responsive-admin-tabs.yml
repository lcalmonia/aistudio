name: Fix responsive admin tabs

on:
  push:
    branches:
      - fix-responsive-admin-views

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand Orders, Stats, and Stock layouts
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/components/ActiveOrdersView.tsx': (
                  'pt-20 px-3.5 sm:px-5 max-w-lg mx-auto pb-28',
                  'pt-20 pb-28 px-3.5 sm:px-5 w-full max-w-[1400px] mx-auto'
              ),
              'src/components/StatsView.tsx': (
                  'pt-20 px-3.5 sm:px-5 max-w-2xl mx-auto pb-28',
                  'pt-20 pb-28 px-3.5 sm:px-5 w-full max-w-[1400px] mx-auto'
              ),
              'src/components/InventoryView.tsx': (
                  'pt-20 px-4 sm:px-6 max-w-4xl mx-auto pb-32',
                  'pt-20 pb-32 px-4 sm:px-6 w-full max-w-[1400px] mx-auto'
              ),
          }

          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected layout class not found in {filename}')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit responsive layout fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-responsive-admin-tabs.yml
          git add src/components/ActiveOrdersView.tsx src/components/StatsView.tsx src/components/InventoryView.tsx .github/workflows/fix-responsive-admin-tabs.yml
          git commit -m "fix: make orders stats and stock responsive"
          git push origin fix-responsive-admin-views
