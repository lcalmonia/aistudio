name: One-time customer delete fix

on:
  push:
    branches:
      - fix/customer-delete-persistence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/customer-delete-persistence
          fetch-depth: 0
      - name: Patch customer directory synchronization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/admin/CustomerManagementView.tsx')
          text = path.read_text()
          old = """      const serverIds = new Set(serverCustomers.map((c) => c.id));
              const serverEmails = new Set(serverCustomers.map((c) => c.email.toLowerCase()));
              const localOnly = (customers || []).filter((c) => !serverIds.has(c.id) && !serverEmails.has((c.email || '').toLowerCase()));
              setDirectoryCustomers([...serverCustomers, ...localOnly]);"""
          new = """      setDirectoryCustomers(serverCustomers);"""
          if old not in text:
              raise SystemExit('Expected customer directory merge block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Keep server customer directory authoritative in local cache
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/services/customerService.ts')
          text = path.read_text()
          old = "async listCustomersFromServer(): Promise<CustomerUser[]> { const response=await api<{customers:CustomerUser[]}>('/api/customers',{method:'GET'}); if(!response||!Array.isArray(response.customers)) throw new CustomerApiError('Invalid customer directory response.'); return response.customers; }"
          new = "async listCustomersFromServer(): Promise<CustomerUser[]> { const response=await api<{customers:CustomerUser[]}>('/api/customers',{method:'GET'}); if(!response||!Array.isArray(response.customers)) throw new CustomerApiError('Invalid customer directory response.'); storageAdapter.setCustomers(response.customers); return response.customers; }"
          if old not in text:
              raise SystemExit('Expected listCustomersFromServer implementation was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/CustomerManagementView.tsx src/services/customerService.ts
          git rm .github/workflows/one-time-fix-customer-delete.yml
          git commit -m "Prevent deleted customers from returning"
          git push origin fix/customer-delete-persistence
