name: Add customer change password UI

on:
  push:
    branches:
      - customer-password-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add customer change password UI
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/customer/CustomerOrderPortal.tsx")
          text = path.read_text(encoding="utf-8")

          if "customerService.changeCustomerPassword" in text:
              print("Change Password UI already present; nothing to do.")
              raise SystemExit(0)

          text = text.replace(
              "import { orderService } from '../../services/orderService';",
              "import { orderService } from '../../services/orderService';\nimport { customerService } from '../../services/customerService';",
              1,
          )

          text = text.replace(
              "  const [profileSavedToast, setProfileSavedToast] = useState(false);",
              """  const [profileSavedToast, setProfileSavedToast] = useState(false);
          const [showPasswordEditor, setShowPasswordEditor] = useState(false);
          const [currentPassword, setCurrentPassword] = useState('');
          const [newPassword, setNewPassword] = useState('');
          const [confirmPassword, setConfirmPassword] = useState('');
          const [passwordChangeMessage, setPasswordChangeMessage] = useState<string | null>(null);
          const [isChangingPassword, setIsChangingPassword] = useState(false);""",
              1,
          )

          anchor = "  // Stamp card calculation (10 stamps per reward)"
          handler = """  const handleChangePassword = async (e: React.FormEvent) => {
            e.preventDefault();
            setPasswordChangeMessage(null);

            if (newPassword.length < 6 || newPassword.length > 128) {
              setPasswordChangeMessage('New password must be 6 to 128 characters.');
              return;
            }
            if (newPassword !== confirmPassword) {
              setPasswordChangeMessage('New password and confirmation do not match.');
              return;
            }

            setIsChangingPassword(true);
            try {
              await customerService.changeCustomerPassword(
                currentCustomer.id,
                currentPassword,
                newPassword,
              );
              setCurrentPassword('');
              setNewPassword('');
              setConfirmPassword('');
              setPasswordChangeMessage('Password changed successfully.');
            } catch (error) {
              setPasswordChangeMessage(
                error instanceof Error ? error.message : 'Unable to change your password.',
              );
            } finally {
              setIsChangingPassword(false);
            }
          };

"""
          if anchor not in text:
              raise SystemExit("Could not find password handler insertion anchor.")
          text = text.replace(anchor, handler + anchor, 1)

          profile_anchor = """            </form>
          </div>
        )}
      </main>"""
          password_ui = """            </form>

            <div className="pt-4 border-t border-[#f3ecea]">
              <div className="flex items-center justify-between gap-3">
                <div>
                  <h4 className="font-serif text-base font-bold text-[#26170c]">Password</h4>
                  <p className="text-[11px] text-[#81756e] mt-0.5">
                    Change your password anytime using your current password.
                  </p>
                </div>
                <button
                  type="button"
                  onClick={() => {
                    setShowPasswordEditor((value) => !value);
                    setPasswordChangeMessage(null);
                  }}
                  className="px-4 py-2 bg-[#f3ecea] hover:bg-[#e8e1df] text-[#26170c] font-bold rounded-xl border border-[#dec1af] transition-all cursor-pointer whitespace-nowrap"
                >
                  {showPasswordEditor ? 'Close' : 'Change Password'}
                </button>
              </div>

              {showPasswordEditor && (
                <form onSubmit={handleChangePassword} className="mt-4 space-y-3">
                  <div>
                    <label className="block font-bold text-[#4f453f] mb-1">Current Password</label>
                    <input
                      type="password"
                      value={currentPassword}
                      onChange={(e) => setCurrentPassword(e.target.value)}
                      className="w-full px-3.5 py-2.5 bg-white border border-[#dec1af] rounded-xl text-[#26170c] focus:ring-2 focus:ring-[#26170c]"
                      autoComplete="current-password"
                      required
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-[#4f453f] mb-1">New Password</label>
                    <input
                      type="password"
                      value={newPassword}
                      onChange={(e) => setNewPassword(e.target.value)}
                      className="w-full px-3.5 py-2.5 bg-white border border-[#dec1af] rounded-xl text-[#26170c] focus:ring-2 focus:ring-[#26170c]"
                      autoComplete="new-password"
                      minLength={6}
                      maxLength={128}
                      required
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-[#4f453f] mb-1">Confirm New Password</label>
                    <input
                      type="password"
                      value={confirmPassword}
                      onChange={(e) => setConfirmPassword(e.target.value)}
                      className="w-full px-3.5 py-2.5 bg-white border border-[#dec1af] rounded-xl text-[#26170c] focus:ring-2 focus:ring-[#26170c]"
                      autoComplete="new-password"
                      minLength={6}
                      maxLength={128}
                      required
                    />
                  </div>

                  {passwordChangeMessage && (
                    <div className="p-3 bg-[#f9f2f0] border border-[#dec1af] rounded-xl text-xs font-semibold text-[#26170c]">
                      {passwordChangeMessage}
                    </div>
                  )}

                  <button
                    type="submit"
                    disabled={isChangingPassword}
                    className="w-full py-3 bg-[#26170c] hover:bg-[#3d2b1f] disabled:opacity-60 text-white font-bold rounded-xl shadow-md transition-all cursor-pointer"
                  >
                    {isChangingPassword ? 'Changing Password...' : 'Save New Password'}
                  </button>
                </form>
              )}
            </div>
          </div>
        )}
      </main>"""
          if profile_anchor not in text:
              raise SystemExit("Could not find profile UI insertion anchor.")
          text = text.replace(profile_anchor, password_ui, 1)

          path.write_text(text, encoding="utf-8")
          print("Customer Change Password UI added successfully.")

      - name: Commit UI patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/customer/CustomerOrderPortal.tsx
          git diff --cached --exit-code && exit 0
          git commit -m "Add customer change password UI"
          git rm .github/workflows/add-customer-password-ui.yml
          git commit -m "Remove one-time customer password UI workflow"
          git push
