name: Apply customer bundle customization patch

on:
  push:
    branches:
      - feature/customer-bundle-modifier-selection

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/customer-bundle-modifier-selection
          fetch-depth: 1

      - name: Patch bundle flow
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected text for {label} in {path}')
              p.write_text(text.replace(old, new, 1))

          types = Path('src/types.ts')
          text = types.read_text()
          replace('src/types.ts',
              "  bundleData?: PromoBundle;\n}",
              "  bundleData?: PromoBundle;\n  /** Customized products selected for this combo, kept with the bundle cart line. */\n  bundleSelections?: CustomerCartItem[];\n}",
              'bundleSelections type')

          replace('src/components/customer/CustomerOrderPortal.tsx',
              "import { CustomerProductModal } from './CustomerProductModal';",
              "import { CustomerProductModal } from './CustomerProductModal';\nimport { BundleCustomizationModal } from './BundleCustomizationModal';",
              'bundle modal import')

          replace('src/components/customer/CustomerOrderPortal.tsx',
              "  const [isProductModalOpen, setIsProductModalOpen] = useState<boolean>(false);",
              "  const [isProductModalOpen, setIsProductModalOpen] = useState<boolean>(false);\n  const [selectedBundle, setSelectedBundle] = useState<PromoBundle | null>(null);\n  const [isBundleCustomizationOpen, setIsBundleCustomizationOpen] = useState<boolean>(false);",
              'bundle modal state')

          old_handler = '''  const handleAddBundleToCart = (bundle: PromoBundle) => {\n    const dummyMenuItem: MenuItem = {\n      id: bundle.id,\n      name: bundle.name,\n      category: 'Combos & Promos',\n      price: bundle.price,\n      image: bundle.image,\n      description: bundle.description,\n      available: true,\n      temperature: 'N/A',\n      tags: ['Combo Bundle', 'Special Offer'],\n    };\n\n    const cartBundle: CustomerCartItem = {\n      id: `cart-bundle-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,\n      menuItem: dummyMenuItem,\n      quantity: 1,\n      unitPrice: bundle.price,\n      totalPrice: bundle.price,\n      selectedTemperature: 'N/A',\n      isBundle: true,\n      bundleData: bundle,\n    };\n\n    setCartItems((prev) => [...prev, cartBundle]);\n    setIsCartOpen(true);\n  };'''
          new_handler = '''  const handleAddBundleToCart = (bundle: PromoBundle) => {\n    setSelectedBundle(bundle);\n    setIsBundleCustomizationOpen(true);\n  };\n\n  const handleCompleteBundleCustomization = (bundle: PromoBundle, selections: CustomerCartItem[]) => {\n    const dummyMenuItem: MenuItem = {\n      id: bundle.id,\n      name: bundle.name,\n      category: 'Combos & Promos',\n      price: bundle.price,\n      image: bundle.image,\n      description: bundle.description,\n      available: true,\n      temperature: 'N/A',\n      tags: ['Combo Bundle', 'Special Offer'],\n    };\n\n    const cartBundle: CustomerCartItem = {\n      id: `cart-bundle-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,\n      menuItem: dummyMenuItem,\n      quantity: 1,\n      unitPrice: bundle.price,\n      totalPrice: bundle.price,\n      selectedTemperature: 'N/A',\n      isBundle: true,\n      bundleData: bundle,\n      bundleSelections: selections,\n    };\n\n    setCartItems((prev) => [...prev, cartBundle]);\n    setSelectedBundle(null);\n    setIsBundleCustomizationOpen(false);\n    setIsCartOpen(true);\n  };'''
          replace('src/components/customer/CustomerOrderPortal.tsx', old_handler, new_handler, 'bundle add handler')

          replace('src/components/customer/CustomerOrderPortal.tsx',
              '''                          onClick={() => handleAddBundleToCart(bundle)}''',
              '''                          onClick={() => handleAddBundleToCart(bundle)}''',
              'bundle button')

          marker = '''      {/* Customer Bag & Checkout Drawer */}\n      <CustomerCartDrawer'''
          insertion = '''      <BundleCustomizationModal\n        isOpen={isBundleCustomizationOpen}\n        onClose={() => {\n          setIsBundleCustomizationOpen(false);\n          setSelectedBundle(null);\n        }}\n        bundle={selectedBundle}\n        menuItems={availableItems}\n        addonsList={addons}\n        modifierCategories={modifierCategories}\n        onComplete={(selections) => {\n          if (selectedBundle) handleCompleteBundleCustomization(selectedBundle, selections);\n        }}\n      />\n\n      {/* Customer Bag & Checkout Drawer */}\n      <CustomerCartDrawer'''
          replace('src/components/customer/CustomerOrderPortal.tsx', marker, insertion, 'bundle modal render')

          cart = Path('src/components/customer/CustomerCartDrawer.tsx')
          cart_text = cart.read_text()
          old_parts = '''      const parts: string[] = [];\n      if (c.selectedTemperature && c.selectedTemperature !== 'N/A') {\n        parts.push(c.selectedTemperature);\n      }\n      if (c.selectedSize) {\n        parts.push(c.selectedSize.name);\n      }\n      if (c.sweetnessLevel) {\n        parts.push(`Sugar: ${c.sweetnessLevel}`);\n      }\n      if (c.iceLevel && c.selectedTemperature === 'Iced') {\n        parts.push(c.iceLevel);\n      }\n      if (c.selectedAddons && c.selectedAddons.length > 0) {\n        parts.push(`+${c.selectedAddons.map((a) => a.name).join(', ')}`);\n      }\n      if (c.specialInstructions) {\n        parts.push(`Note: ${c.specialInstructions}`);\n      }'''
          new_parts = '''      const parts: string[] = [];\n      if (c.isBundle && c.bundleSelections && c.bundleSelections.length > 0) {\n        c.bundleSelections.forEach((selection) => {\n          const productParts: string[] = [];\n          if (selection.selectedTemperature && selection.selectedTemperature !== 'N/A') productParts.push(selection.selectedTemperature);\n          if (selection.selectedSize) productParts.push(selection.selectedSize.name);\n          if (selection.sweetnessLevel) productParts.push(`Sugar: ${selection.sweetnessLevel}`);\n          if (selection.iceLevel && selection.selectedTemperature === 'Iced') productParts.push(selection.iceLevel);\n          if (selection.selectedAddons && selection.selectedAddons.length > 0) {\n            productParts.push(`+${selection.selectedAddons.map((a) => a.name).join(', ')}`);\n          }\n          if (selection.specialInstructions) productParts.push(`Note: ${selection.specialInstructions}`);\n          parts.push(`${selection.menuItem.name}: ${productParts.length > 0 ? productParts.join(' • ') : 'Standard Preparation'}`);\n        });\n      } else {\n        if (c.selectedTemperature && c.selectedTemperature !== 'N/A') {\n          parts.push(c.selectedTemperature);\n        }\n        if (c.selectedSize) {\n          parts.push(c.selectedSize.name);\n        }\n        if (c.sweetnessLevel) {\n          parts.push(`Sugar: ${c.sweetnessLevel}`);\n        }\n        if (c.iceLevel && c.selectedTemperature === 'Iced') {\n          parts.push(c.iceLevel);\n        }\n        if (c.selectedAddons && c.selectedAddons.length > 0) {\n          parts.push(`+${c.selectedAddons.map((a) => a.name).join(', ')}`);\n        }\n        if (c.specialInstructions) {\n          parts.push(`Note: ${c.specialInstructions}`);\n        }\n      }'''
          replace('src/components/customer/CustomerCartDrawer.tsx', old_parts, new_parts, 'bundle checkout customization')

          old_h5 = '''                        <h5 className="text-xs font-bold text-[#26170c] leading-tight truncate">\n                          {item.menuItem.name}\n                        </h5>'''
          new_h5 = '''                        <h5 className="text-xs font-bold text-[#26170c] leading-tight truncate">\n                          {item.menuItem.name}\n                        </h5>\n                        {item.isBundle && item.bundleData && (\n                          <div className="mt-1.5 space-y-0.5">\n                            {item.bundleSelections?.map((selection) => (\n                              <div key={selection.id} className="text-[10px] text-[#4f453f] leading-snug">\n                                <span className="font-bold text-[#26170c]">{selection.menuItem.name}:</span>{' '}\n                                {selection.selectedAddons && selection.selectedAddons.length > 0\n                                  ? selection.selectedAddons.map((addon) => addon.name).join(', ')\n                                  : selection.selectedSize?.name || 'Standard'}\n                              </div>\n                            ))}\n                          </div>\n                        )}'''
          replace('src/components/customer/CustomerCartDrawer.tsx', old_h5, new_h5, 'bundle cart display')

          workflow = Path('.github/workflows/patch-customer-bundle-customization.yml')
          workflow.unlink()

          print('Patch applied successfully.')
