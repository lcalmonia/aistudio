name: Fix rewards JSX
on:
  push:
    branches: [rewards-loyalty-configurable]
    paths: ['.github/workflows/fix-rewards-jsx.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs'); const {execSync}=require('child_process');
            let p=fs.readFileSync('src/components/customer/CustomerOrderPortal.tsx','utf8');
            const marker='        {/* TAB 4: PROFILE & ADDRESS VIEW */}';
            const i=p.indexOf(marker); if(i<0) throw new Error('Profile marker not found');
            const before=p.slice(0,i); const tail=p.slice(i);
            if(!before.trimEnd().endsWith(')}')) p=before+'        )}\n'+tail;
            fs.writeFileSync('src/components/customer/CustomerOrderPortal.tsx',p);
            fs.unlinkSync('.github/workflows/fix-rewards-jsx.yml');
            execSync('git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add . && git commit -m "fix: close customer rewards JSX section" && git push');
