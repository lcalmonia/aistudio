name: Fix payment backend
on:
  push:
    branches:
      - feature/collapsible-barista-order-sections
permissions:
  contents: write
jobs:
  fix:
    if: github.actor == 'lcalmonia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update payment method persistence
        shell: python
        run: |
          from pathlib import Path
          p = Path('netlify/functions/order-detail.mts')
          s = p.read_text()
          old = "const updatedOrder = await updateOrderStatusInDatabase(orderId, status);"
          new = "const paymentMethod = typeof body.paymentMethod === 'string' ? body.paymentMethod : undefined;\n      if (paymentMethod && !['GCash', 'Maya', 'Cash', 'Card'].includes(paymentMethod)) {\n        throw new RequestError(400, `Invalid payment method \\\"${paymentMethod}\\\".`);\n      }\n\n      const updatedOrder = await updateOrderStatusInDatabase(orderId, status, paymentMethod as 'GCash' | 'Maya' | 'Cash' | 'Card' | undefined);"
          if old not in s:
              raise SystemExit('order-detail update call not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit and clean up
        run: |
          rm -f .github/workflows/patch-payment-persistence.yml .github/workflows/fix-payment-backend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/order-detail.mts .github/workflows/patch-payment-persistence.yml .github/workflows/fix-payment-backend.yml
          git commit -m "feat: persist selected barista payment method"
          git push
