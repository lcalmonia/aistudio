name: Patch barista payment persistence
on:
  push:
    branches:
      - feature/collapsible-barista-order-sections
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'lcalmonia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch payment persistence
        shell: python
        run: |
          from pathlib import Path

          # App.tsx: pass the selected payment method through to the order service.
          p = Path('src/App.tsx')
          s = p.read_text()
          old = "const handleUpdateOrderStatus = async (orderId: string, newStatus: OrderStatus) => {\n    const updated = await orderService.updateOrderStatus(orderId, newStatus);"
          new = "const handleUpdateOrderStatus = async (orderId: string, newStatus: OrderStatus, paymentMethod?: 'GCash' | 'Maya' | 'Cash' | 'Card') => {\n    const updated = await orderService.updateOrderStatus(orderId, newStatus, paymentMethod);"
          if old not in s: raise SystemExit('App.tsx handler target not found')
          p.write_text(s.replace(old, new, 1))

          # orderService.ts: send paymentMethod on PATCH and preserve it in local fallback.
          p = Path('src/services/orderService.ts')
          s = p.read_text()
          old = "async updateOrderStatus(orderId: string, status: OrderStatus): Promise<Order | null> {"
          new = "async updateOrderStatus(orderId: string, status: OrderStatus, paymentMethod?: 'GCash' | 'Maya' | 'Cash' | 'Card'): Promise<Order | null> {"
          if old not in s: raise SystemExit('orderService signature target not found')
          s = s.replace(old, new, 1)
          old = "body: JSON.stringify({ status }),"
          new = "body: JSON.stringify({ status, ...(paymentMethod ? { paymentMethod } : {}) }),"
          if old not in s: raise SystemExit('orderService body target not found')
          s = s.replace(old, new, 1)
          old = "      status,\n      updatedAt: new Date().toISOString(),"
          new = "      status,\n      ...(paymentMethod ? { paymentMethod } : {}),\n      updatedAt: new Date().toISOString(),"
          if old not in s: raise SystemExit('orderService fallback target not found')
          p.write_text(s.replace(old, new, 1))

          # _shared/orders.mts: update payment_method when a payment method is supplied.
          p = Path('netlify/functions/_shared/orders.mts')
          s = p.read_text()
          old = "export async function updateOrderStatusInDatabase(orderId: string, status: OrderStatus): Promise<FormattedOrder> {"
          new = "export async function updateOrderStatusInDatabase(orderId: string, status: OrderStatus, paymentMethod?: 'GCash' | 'Maya' | 'Cash' | 'Card'): Promise<FormattedOrder> {"
          if old not in s: raise SystemExit('orders.mts signature target not found')
          s = s.replace(old, new, 1)
          old = "    let updateQuery = `\n      UPDATE orders\n      SET status = $1,\n          updated_at = NOW()\n    `;\n    const params: unknown[] = [status];\n    let paramIndex = 2;"
          new = "    let updateQuery = `\n      UPDATE orders\n      SET status = $1,\n          updated_at = NOW()\n    `;\n    const params: unknown[] = [status];\n    let paramIndex = 2;\n\n    if (paymentMethod) {\n      updateQuery += `, payment_method = $${paramIndex}`;\n      params.push(paymentMethod);\n      paramIndex += 1;\n    }"
          if old not in s: raise SystemExit('orders.mts update target not found')
          p.write_text(s.replace(old, new, 1))

          # order-detail.mts: validate and pass payment method to database update.
          p = Path('netlify/functions/order-detail.mts')
          s = p.read_text()
          old = "      const existingOrder = await fetchOrderById(orderId);\n      if (!existingOrder) throw new RequestError(404, `Order \\\"${orderId}\\\" not found.`);\n\n      const updatedOrder = await updateOrderStatusInDatabase(orderId, status);"
          new = "      const existingOrder = await fetchOrderById(orderId);\n      if (!existingOrder) throw new RequestError(404, `Order \\\"${orderId}\\\" not found.`);\n\n      const paymentMethod = typeof body.paymentMethod === 'string' ? body.paymentMethod : undefined;\n      if (paymentMethod && !['GCash', 'Maya', 'Cash', 'Card'].includes(paymentMethod)) {\n        throw new RequestError(400, `Invalid payment method \\\"${paymentMethod}\\\".`);\n      }\n\n      const updatedOrder = await updateOrderStatusInDatabase(orderId, status, paymentMethod as 'GCash' | 'Maya' | 'Cash' | 'Card' | undefined);"
          if old not in s: raise SystemExit('order-detail target not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/services/orderService.ts netlify/functions/_shared/orders.mts netlify/functions/order-detail.mts .github/workflows/patch-payment-persistence.yml
          git commit -m "feat: persist barista payment method on completion"
          git rm .github/workflows/patch-payment-persistence.yml
          git commit -m "chore: remove temporary payment persistence workflow"
          git push
