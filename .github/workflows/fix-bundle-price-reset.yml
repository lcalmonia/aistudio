name: Fix bundle price reset

on:
  push:
    branches:
      - fix-responsive-admin-views

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix bundle modal reset dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/EditBundleModal.tsx')
          s = p.read_text()
          old = "  }, [bundleToEdit, isOpen, menuItems]);"
          new = "  }, [bundleToEdit?.id, isOpen]);"
          if old not in s:
              raise SystemExit('Expected dependency line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EditBundleModal.tsx
          git commit -m "fix: preserve editable combo price"
          rm .github/workflows/fix-bundle-price-reset.yml
          git add .github/workflows/fix-bundle-price-reset.yml
          git commit -m "chore: remove temporary bundle fix workflow"
          git push
