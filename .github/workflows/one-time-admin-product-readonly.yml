name: One-time admin product readonly fix

on:
  push:
    branches:
      - fix/barista-category-tabs

permissions:
  contents: write

jobs:
  patch-product-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hide product availability control for Admin
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/AdminMenuView.tsx')
          s = p.read_text()
          old = '''                    {/* Stock Switch */}
                    <button
                      onClick={() => handleToggleProduct(product.id)}
                      className={`px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all flex items-center gap-1 cursor-pointer flex-shrink-0 ${
                        product.available
                          ? 'bg-[#e1e1c9] text-[#636451] hover:bg-[#d5d5b8]'
                          : 'bg-[#ffdad6] text-[#ba1a1a] hover:bg-[#ffb4ab]'
                      }`}
                    >
                      <span className="material-symbols-outlined text-[14px]">
                        {product.available ? 'check_circle' : 'do_not_disturb_on'}
                      </span>
                      <span>{product.available ? 'In Stock' : 'Mark In Stock'}</span>
                    </button>'''
          new = '''                    {/* Stock / availability is also Super Admin-only for Menu Master Control */}
                    {isSuperAdmin && (
                      <button
                        onClick={() => handleToggleProduct(product.id)}
                        className={`px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold transition-all flex items-center gap-1 cursor-pointer flex-shrink-0 ${
                          product.available
                            ? 'bg-[#e1e1c9] text-[#636451] hover:bg-[#d5d5b8]'
                            : 'bg-[#ffdad6] text-[#ba1a1a] hover:bg-[#ffb4ab]'
                        }`}
                      >
                        <span className="material-symbols-outlined text-[14px]">
                          {product.available ? 'check_circle' : 'do_not_disturb_on'}
                        </span>
                        <span>{product.available ? 'In Stock' : 'Mark In Stock'}</span>
                      </button>
                    )}'''
          if old not in s:
              raise SystemExit('Expected product stock control block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminMenuView.tsx .github/workflows/one-time-admin-product-readonly.yml
          git rm .github/workflows/one-time-admin-product-readonly.yml
          git commit -m "Make admin menu availability read-only"
          git push
