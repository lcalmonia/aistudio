name: Apply modifier category wrapping fix
on:
  workflow_dispatch:
  push:
    branches:
      - feature/customer-portal-all-categories-visible
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/customer-portal-all-categories-visible
      - name: Update modifier category layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/EditProductModal.tsx')
          s = p.read_text()
          old = '            <div className="flex items-center justify-between gap-2">\n              <div className="flex gap-1 overflow-x-auto scrolling-hide py-0.5 flex-1">'
          new = '            <div className="flex flex-col gap-2">\n              <div className="flex flex-wrap gap-1 py-0.5 w-full">'
          if old not in s:
              raise SystemExit('Target modifier category layout not found')
          s = s.replace(old, new, 1)
          old2 = '              <div className="flex items-center gap-1 flex-shrink-0">'
          new2 = '              <div className="flex items-center gap-1 flex-wrap justify-end">'
          if old2 not in s:
              raise SystemExit('Target quick-select controls not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EditProductModal.tsx .github/workflows/temp-fix-modifier-category-wrap.yml
          git commit -m "fix: show all modifier categories by wrapping" \
            || exit 0
          git rm .github/workflows/temp-fix-modifier-category-wrap.yml
          git commit -m "chore: remove temporary modifier category workflow"
          git push origin HEAD:feature/customer-portal-all-categories-visible
